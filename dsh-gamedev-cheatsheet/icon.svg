<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Game dev cheatsheet">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16211a"/>
      <stop offset="1" stop-color="#0b120e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ff7a"/>
      <stop offset="1" stop-color="#8fbf2f"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <path d="M32 3.2 55.6 16.6v30.8L32 60.8 8.4 47.4V16.6z" fill="url(#plate)" stroke="#2c3b2c" stroke-width="1.2"/>

  <!-- concept grid: 9 nodes -->
  <g fill="#465a44">
    <circle cx="22" cy="22" r="2.1"/>
    <circle cx="32" cy="22" r="2.1"/>
    <circle cx="42" cy="22" r="2.1"/>
    <circle cx="22" cy="32" r="2.1"/>
    <circle cx="32" cy="32" r="2.1"/>
    <circle cx="42" cy="32" r="2.1"/>
    <circle cx="22" cy="42" r="2.1"/>
    <circle cx="32" cy="42" r="2.1"/>
    <circle cx="42" cy="42" r="2.1"/>
  </g>

  <!-- links between neighbouring nodes -->
  <g stroke="#3a4d38" stroke-width="1.1" stroke-linecap="round">
    <path d="M22 22h20M22 32h20M22 42h20M22 22v20M32 22v20M42 22v20"/>
  </g>

  <!-- highlighted ricochet path: in, bounce, out -->
  <path d="M13 46 32 32 51 22" fill="none" stroke="url(#accent)" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="3.4" fill="#0b120e" stroke="url(#accent)" stroke-width="2.2"/>
  <circle cx="13" cy="46" r="2.2" fill="url(#accent)"/>
  <circle cx="51" cy="22" r="2.2" fill="url(#accent)"/>
</svg>
